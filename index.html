<!DOCTYPE html>
<html lang="pt-BR" data-theme="ordem">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa — Crônicas &amp; Tabuleiro de RPG</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mesa_rpg_theme');
          var valid = saved === 'ordem' || saved === 'dnd' || saved === 'tormenta';
          document.documentElement.setAttribute('data-theme', valid ? saved : 'ordem');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'ordem');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
